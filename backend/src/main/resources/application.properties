spring.application.name=logistock
server.port=8080

# Base de données (valeurs par défaut = XAMPP : root, sans mot de passe)
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/logistock}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Le schéma vient de schema.sql : Hibernate ne touche pas aux tables
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT (le secret doit faire au moins 32 caractères ; à changer en production)
app.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me-1234}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# Origines autorisées pour le frontend Angular (ng serve, Apache de XAMPP)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost}
