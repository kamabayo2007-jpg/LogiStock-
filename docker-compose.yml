services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-rootpass}
      MARIADB_DATABASE: logistock
    volumes:
      - db_data:/var/lib/mysql
      - ./docs/conception/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docs/conception/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mariadb://db:3306/logistock
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpass}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-a-changer-dev-secret-a-changer}
      CORS_ORIGINS: http://localhost:4200,http://localhost
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  db_data:
