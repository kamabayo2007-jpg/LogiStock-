server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Le service worker ne doit jamais rester en cache
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # Application Angular : toute adresse inconnue renvoie index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
